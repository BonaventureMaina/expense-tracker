{% extends 'base.html' %}

{% block title %}Delete Expense{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Delete Expense</h2>
    <p class="text-gray-600 mb-6">Are you sure you want to delete <strong>{{ object.title }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-center gap-4">
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">Yes, Delete</button>
            <a href="{% url 'expense_list' %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded hover:bg-gray-300">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
