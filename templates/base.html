<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow mb-8">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'expense_list' %}" class="text-xl font-bold text-indigo-600">Expense Tracker</a>
            <div class="flex gap-4 items-center">
                {% if request.user.is_authenticated %}
                    <span class="text-gray-600 text-sm">Hi, {{ request.user.username }}</span>
                    <a href="{% url 'expense_create' %}" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm">+ Add Expense</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="text-sm text-gray-500 hover:text-red-500">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm text-gray-600 hover:text-indigo-600">Login</a>
                    <a href="{% url 'register' %}" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
        <div class="max-w-4xl mx-auto px-4 mb-6">
            {% for message in messages %}
                <div class="p-4 rounded mb-2 
                    {% if message.tags == 'success' %}bg-green-100 text-green-800
                    {% elif message.tags == 'error' %}bg-red-100 text-red-800
                    {% else %}bg-blue-100 text-blue-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Main content -->
    <main class="max-w-4xl mx-auto px-4">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
